# NOTE: set different password and login for all replicas and replicas backup
services:  
  postgres:
    build: .
    container_name: routes_db
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=${PG_DATABASE}
      - REPL_USER=${REPL_USER}
      - REPL_PASSWD=${REPL_PASSWD}
      - IS_MASTER=true
      - IS_SYNC_REPL1=false
      - IS_SYNC_REPL2=false
      - IS_REPL1=false
      - IS_REPL2=false
      - PG_PORT=${PG_PORT}
      - PGR1_PORT=${PGR1_PORT}
      - PGR2_PORT=${PGR2_PORT}
      - PGR1B_PORT=${PGR1B_PORT}
      - PGR2B_PORT=${PGR2B_PORT}
    ports:
      - ${PG_PORT}:${PG_PORT}
    volumes:
      - master:/var/lib/postgresql/data
      - ./pg_conf/master.conf:/etc/postgresql/postgresql.conf
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    command: >
      -c config_file=/etc/postgresql/postgresql.conf
#      -c synchronous_standby_names='FIRST 2 (routes_db_repl1, routes_db_repl2)'
    networks:
      cluster_net:
        ipv4_address: 172.18.0.2
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0' 


  postgres_replica1:
    image: pgrouting/pgrouting:17-3.5-main
    container_name: routes_db_repl1
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=${PG_DATABASE}
      - REPL_USER=${REPL_USER}
      - REPL_PASSWD=${REPL_PASSWD}
      - IS_MASTER=false
      - IS_SYNC_REPL1=true
      - IS_SYNC_REPL2=false
      - IS_REPL1=false
      - IS_REPL2=false
      - PG_PORT=${PG_PORT}
      - PGR1_PORT=${PGR1_PORT}
      - PGR2_PORT=${PGR2_PORT}
      - PGR1B_PORT=${PGR1B_PORT}
      - PGR2B_PORT=${PGR2B_PORT}
    ports:
      - ${PGR1_PORT}:${PG_PORT}
    volumes:
      - replica1:/var/lib/postgresql/data
      - ./pg_conf/replica1.conf:/etc/postgresql/postgresql.conf
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    command: >
      -c config_file=/etc/postgresql/postgresql.conf
#      -c primary_conninfo='host=routes_db port=${PG_PORT} user=${REPL_USER} password=${REPL_PASSWD} application_name=routes_db_repl1'
    networks:
      cluster_net:
        ipv4_address: 172.18.0.3

  postgres_replica2:
    image: pgrouting/pgrouting:17-3.5-main
    container_name: routes_db_repl2
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=${PG_DATABASE}
      - REPL_USER=${REPL_USER}
      - REPL_PASSWD=${REPL_PASSWD}
      - IS_MASTER=false
      - IS_SYNC_REPL1=false
      - IS_SYNC_REPL2=true
      - IS_REPL1=false
      - IS_REPL2=false
      - PG_PORT=${PG_PORT}
      - PGR1_PORT=${PGR1_PORT}
      - PGR2_PORT=${PGR2_PORT}
      - PGR1B_PORT=${PGR1B_PORT}
      - PGR2B_PORT=${PGR2B_PORT}
    ports:
      - ${PGR2_PORT}:${PG_PORT}
    volumes:
      - replica2:/var/lib/postgresql/data
      - ./pg_conf/replica2.conf:/etc/postgresql/postgresql.conf
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    command: >
      -c config_file=/etc/postgresql/postgresql.conf
#      -c primary_conninfo='host=routes_db port=${PG_PORT} user=${REPL_USER} password=${REPL_PASSWD} application_name=routes_db_repl2'
    networks:
      cluster_net:
        ipv4_address: 172.18.0.4

  postgres_replica1_backup:
    image: pgrouting/pgrouting:17-3.5-main
    container_name: routes_db_repl1_backup
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=${PG_DATABASE}
      - REPL_USER=${REPL_USER}
      - REPL_PASSWD=${REPL_PASSWD}
      - IS_MASTER="false"
      - IS_SYNC_REPL1="false"
      - IS_SYNC_REPL2="false"
      - IS_REPL1="true"
      - IS_REPL2="false"
      - PG_PORT=${PG_PORT}
      - PGR1_PORT=${PGR1_PORT}
      - PGR2_PORT=${PGR2_PORT}
      - PGR1B_PORT=${PGR1B_PORT}
      - PGR2B_PORT=${PGR2B_PORT}
    ports:
      - ${PGR1B_PORT}:${PG_PORT}
    volumes:
      - replica_backup1:/var/lib/postgresql/data
      - ./pg_conf/backup_replica.conf:/etc/postgresql/postgresql.conf
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    command: >
      -c config_file=/etc/postgresql/postgresql.conf
#      -c primary_conninfo='host=routes_db_repl1 port=${PGR1_PORT} user=${REPL_USER} password=${REPL_PASSWD} application_name=routes_db_repl1_backup'
    networks:
      cluster_net:
        ipv4_address: 172.18.0.5

  postgres_replica2_backup:
    image: pgrouting/pgrouting:17-3.5-main
    container_name: routes_db_repl2_backup
    environment:
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_DB=${PG_DATABASE}
      - REPL_USER=${REPL_USER}
      - REPL_PASSWD=${REPL_PASSWD}
      - IS_MASTER="false"
      - IS_SYNC_REPL1="false"
      - IS_SYNC_REPL2="false"
      - IS_REPL1="false"
      - IS_REPL2="true"
      - PG_PORT=${PG_PORT}
      - PGR1_PORT=${PGR1_PORT}
      - PGR2_PORT=${PGR2_PORT}
      - PGR1B_PORT=${PGR1B_PORT}
      - PGR2B_PORT=${PGR2B_PORT}
    ports:
      - ${PGR2B_PORT}:${PG_PORT}
    volumes:
      - replica_backup2:/var/lib/postgresql/data
      - ./pg_conf/backup_replica.conf:/etc/postgresql/postgresql.conf
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    command: >
      -c config_file=/etc/postgresql/postgresql.conf
#      -c primary_conninfo='host=routes_db_repl2 port=${PGR2_PORT} user=${REPL_USER} password=${REPL_PASSWD} application_name=routes_db_repl2_backup'
    networks:
      cluster_net:
        ipv4_address: 172.18.0.6

volumes:
  master:
  replica1:
  replica2:
  replica_backup1:
  replica_backup2:
  #pg_conf/master.conf:
  #pg_conf/replica1.conf:
  #pg_conf/replica2.conf:
  #pg_conf:

networks:
  cluster_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

